services:
  api:
    env_file: .env
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
  db:
    image: postgres:17.4
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: