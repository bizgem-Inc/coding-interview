version: '3'
services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: root
      POSTGRES_DB: coding-test
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./.data/db:/var/lib/postgresql/data
  app:
    build: .
    environment:
      DB_HOST_NAME: db
    volumes:
      - .:/app
    command: python app/manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    depends_on:
      - db
