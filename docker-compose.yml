services:
  db:
    image: postgres:17
    volumes:
      - postgres_data:/var/lib/pgsql/data/
    environment:
      - POSTGRES_DB=coding-test
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d coding-test"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
