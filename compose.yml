services:
  app:
    build: .
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DB_HOST_NAME=db
      - POSTGRES_DB=coding-test
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=password
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=coding-test
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d coding-test"]
      interval: 5s
      timeout: 5s
      retries: 5
