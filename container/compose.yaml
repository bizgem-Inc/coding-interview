services:
  db:
    image: postgres:15
    container_name: postgres_container
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: coding-test
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data # データ永続化のためのボリューム

volumes:
  postgres_data:
